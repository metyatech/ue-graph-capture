[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ue-graph-capture"
version = "0.1.0"
description = "Cross-platform CLI for capturing complete Unreal Engine Blueprint graphs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "metyatech" }]
dependencies = [
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
ue-graph-capture = "ue_graph_capture.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ue_graph_capture = [
  "bundled/UEGraphCapture/*.json",
  "bundled/UEGraphCapture/*.uplugin",
  "bundled/UEGraphCapture/Source/**/*.Build.cs",
  "bundled/UEGraphCapture/Source/**/*.cpp",
  "bundled/UEGraphCapture/Source/**/*.h",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
